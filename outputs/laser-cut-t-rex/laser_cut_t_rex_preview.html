	#ifdef USE_IRIDESCENCE

	#else

		vec3 Fr = specularColor;

	float Ems = 1.0 - Ess;

	multiScatter += Fms * Ems;

function emitEvent(name,...args){for(const fn of runtimeEvents?.get(name)||[])fn(...args)}
function runHyp(bytes){const{header,assets}=parseHyp(bytes),scriptURL=header.blueprint?.script,asset=assets.find(a=>a.url===scriptURL)||assets.find(a=>a.type==='script');if(!header.blueprint?.model)throw new Error('Package has no model asset');if(!asset)throw new Error('No script asset found');rootNodes=[];worldNodes=[];runtimeEvents=new Map();const root=makeNode('app',{position:[0,0,0],quaternion:[0,0,0,1],scale:[1,1,1]});const app=root;app.create=(kind,config={})=>makeNode(kind,config);app.add=node=>{node.parent=app;rootNodes.push(node);return node};app.on=(name,fn)=>{if(!runtimeEvents.has(name))runtimeEvents.set(name,new Set());runtimeEvents.get(name).add(fn)};app.off=(name,fn)=>runtimeEvents.get(name)?.delete(fn);app.isMoving=false;app.resetOnMove=false;const world={isClient:true,isServer:false,add(node){if(node.parent){node.parent=null}if(!worldNodes.includes(node))worldNodes.push(node);return node},remove(node){const i=worldNodes.indexOf(node);if(i>=0)worldNodes.splice(i,1)}};const props={},DEG2RAD=Math.PI/180,RAD2DEG=180/Math.PI;runtimeApp=app;new Function('app','world','props','DEG2RAD','RAD2DEG',new TextDecoder().decode(asset.data))(app,world,props,DEG2RAD,RAD2DEG);emitEvent('update',0);rebuildScene();const count=(function walk(ns){let c=0;for(const n of ns){c++;c+=walk(n.children||[])}return c})(rootNodes)+worldNodes.length;document.getElementById('status').textContent=`${header.blueprint?.name||'App'} — ${count} nodes · viewer ${VIEWER_VERSION}`}

let yaw=0,pitch=0,dist=18,target=[0,4.8,0],panX=0,panY=0;const keys=new Set();addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','a','s','d','shift',' '].includes(k)){keys.add(k);e.preventDefault()}});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());let last=performance.now();function updateKeys(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;let f=0,s=0,v=0;if(keys.has('w'))f++;if(keys.has('s'))f--;if(keys.has('d'))s++;if(keys.has('a'))s--;if(keys.has(' '))v++;if(keys.has('shift'))v--;if(!f&&!s&&!v)return;const m=Math.hypot(f,s)||1;f/=m;s/=m;const sp=3*dt,sy=Math.sin(yaw),cy=Math.cos(yaw),fx=-sy,fz=-cy,rx=cy,rz=-sy;target[0]+=(fx*f+rx*s)*sp;target[2]+=(fz*f+rz*s)*sp;target[1]+=v*sp}
