# Gate adapted backports: https://github.com/dwebxr/coo-world/commit/1f528221b240be0be73d4f97179d5fea36834bb2
name: Security and builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: npm run client:build
      - run: npm run node-client:build
      - run: npm run build
      - run: node --test test/security/server.integration.test.mjs
